<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickCart Checkout</title>
<style>
  :root {
    --ink: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --card: #ffffff;
    --brand: #6d5dfc;
    --brand-2: #4f46e5;
    --brand-soft: #f1efff;
    --gold: #f5c36b;
    --err: #b42318;
    --err-bg: #fef3f2;
    --ok: #067647;
    --ok-bg: #ecfdf3;
    --radius: 18px;
    --shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 20px 40px -18px rgba(2,6,23,.55);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--ink);
    font: 15px/1.45 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(900px 480px at 8% -10%, rgba(109,93,252,.55), transparent 60%),
      radial-gradient(800px 420px at 100% 0%, rgba(245,195,107,.22), transparent 55%),
      linear-gradient(160deg, #0b1020 0%, #141a3a 55%, #1b1650 100%);
    background-attachment: fixed;
    display: flex; flex-direction: column;
  }

  /* ---------- Header ---------- */
  .topbar { flex: none; }
  .topbar-inner { max-width: 1120px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; color: #fff; }
  .logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
          background: linear-gradient(135deg, var(--brand), #a78bfa); box-shadow: 0 6px 16px -4px rgba(109,93,252,.8); }
  .logo svg { width: 19px; height: 19px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .brand-name { font-size: 1.25rem; font-weight: 800; letter-spacing: -.02em; }
  .brand-tag { color: #aab3d6; font-size: .85rem; margin-left: 4px; }
  .steps { display: flex; align-items: center; gap: 8px; list-style: none; margin: 0; padding: 0; }
  .steps li { display: flex; align-items: center; gap: 8px; color: #8d97c4; font-size: .82rem; font-weight: 600; }
  .steps li + li::before { content: ""; width: 22px; height: 1px; background: rgba(255,255,255,.2); }
  .steps .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: .75rem;
              border: 1px solid rgba(255,255,255,.25); }
  .steps li.active { color: #fff; }
  .steps li.active .n { background: linear-gradient(135deg, var(--brand), #a78bfa); border-color: transparent; }
  .steps li.done { color: #9be7bd; }
  .steps li.done .n { background: #16a34a; border-color: transparent; color: #fff; }

  /* ---------- Layout ---------- */
  main { flex: 1; min-height: 0; width: 100%; max-width: 1120px; margin: 0 auto; padding: 4px 24px 20px;
         display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 18px; }
  .col { display: flex; flex-direction: column; gap: 18px; min-width: 0; min-height: 0; }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; }
  .card h2 { margin: 0 0 12px; font-size: .78rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .grow { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  /* ---------- Products ---------- */
  .products { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .product { position: relative; display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 4px 12px; align-items: center;
             border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: linear-gradient(180deg, #fff, #fafaff); }
  .product .icon { grid-row: span 2; width: 48px; height: 48px; border-radius: 13px; display: grid; place-items: center;
                   background: linear-gradient(135deg, #ede9fe, #e0e7ff); }
  .product .icon svg { width: 24px; height: 24px; stroke: var(--brand-2); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .pname { font-weight: 700; line-height: 1.2; }
  .price { color: var(--muted); font-size: .9rem; }
  .product .btn-add { grid-column: 1 / -1; margin-top: 6px; }
  .badge { position: absolute; top: 10px; right: 10px; min-width: 24px; height: 22px; padding: 0 8px; border-radius: 999px;
           background: var(--ink); color: #fff; font-size: .75rem; font-weight: 700; display: grid; place-items: center; }
  .badge[hidden] { display: none; }

  /* ---------- Buttons ---------- */
  button { user-select: none; font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--ink);
           padding: 7px 12px; transition: transform .12s, box-shadow .15s, background .15s, border-color .15s; }
  button:hover:not(:disabled) { border-color: var(--brand); background: var(--brand-soft); }
  button:focus-visible, input:focus-visible { outline: 3px solid rgba(109,93,252,.4); outline-offset: 1px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .btn-add { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }
  .btn-add:hover:not(:disabled) { background: #1e293b; border-color: #1e293b; transform: translateY(-1px); }
  .btn-primary { width: 100%; padding: 13px; border: 0; color: #fff; font-weight: 700; font-size: 1rem; letter-spacing: .01em;
                 background: linear-gradient(135deg, var(--brand), var(--brand-2)); box-shadow: 0 10px 24px -8px rgba(79,70,229,.75); }
  .btn-primary:hover:not(:disabled) { background: linear-gradient(135deg, #7c6dff, #5b52f0); transform: translateY(-1px); }
  .btn-primary:disabled { box-shadow: none; }
  .btn-link { border: 0; background: none; color: var(--err); padding: 4px 8px; font-size: .85rem; }
  .btn-link:hover:not(:disabled) { background: var(--err-bg); border: 0; }

  /* ---------- Cart ---------- */
  .muted { color: var(--muted); }
  .empty { display: grid; place-items: center; gap: 2px; text-align: center; padding: 18px 12px; margin: 0; flex: 1;
           border: 1.5px dashed #cbd5e1; border-radius: 14px; background: #f8fafc; }
  .empty strong { color: var(--ink); }
  #cart-items { overflow: auto; }
  #cart-items:empty { display: none; }
  .cart-row { display: grid; grid-template-columns: minmax(0, 1fr) auto 78px auto; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .cart-row:first-child { padding-top: 0; }
  .qty { display: inline-flex; align-items: center; gap: 4px; }
  .qty button { width: 30px; height: 30px; padding: 0; font-size: 1.05rem; line-height: 1; border-radius: 9px; }
  .qty input { width: 48px; height: 30px; text-align: center; font: inherit; border: 1px solid var(--line); border-radius: 9px; }
  .line-total { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .total-row { margin-top: auto; display: flex; justify-content: space-between; align-items: baseline; padding-top: 12px; }
  .total-row .label { color: var(--muted); font-weight: 600; }
  #order-total { font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

  /* ---------- Form ---------- */
  label { display: block; font-weight: 600; margin-bottom: 6px; font-size: .9rem; }
  input[type=text] { width: 100%; font: inherit; padding: 11px 13px; border: 1px solid #cbd5e1; border-radius: 11px; background: #fff; transition: border-color .15s, box-shadow .15s; }
  input[type=text]:focus { border-color: var(--brand); }
  input[type=text]:disabled { background: #f1f5f9; color: #475569; }
  input[aria-invalid=true] { border-color: var(--err); background: var(--err-bg); }
  .error { display: flex; gap: 8px; margin: 8px 0 0; padding: 9px 11px; border-radius: 10px; background: var(--err-bg); color: var(--err); font-size: .9rem; font-weight: 500; }
  .error::before { content: "!"; flex: none; width: 18px; height: 18px; border-radius: 50%; background: var(--err); color: #fff; font-weight: 800; font-size: .72rem; display: grid; place-items: center; margin-top: 1px; }
  .secure { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 10px 0 0; color: var(--muted); font-size: .8rem; }
  .secure svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- Confirmation ---------- */
  .confirmation { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 14px; align-items: center;
                  border-radius: var(--radius); padding: 16px 18px; color: #fff;
                  background: linear-gradient(135deg, #059669, #047857); box-shadow: 0 18px 36px -14px rgba(5,150,105,.7);
                  animation: pop .35s cubic-bezier(.2,.9,.3,1.2); }
  .confirmation:focus { outline: none; }
  .tick { width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,.2); display: grid; place-items: center; }
  .tick svg { width: 26px; height: 26px; stroke: #fff; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .confirmation h2 { margin: 0; font-size: 1.2rem; letter-spacing: -.01em; text-transform: none; color: #fff; }
  .confirmation p { margin: 2px 0 0; font-size: .92rem; color: #d1fae5; }
  .confirmation strong { color: #fff; }
  .ref { display: inline-block; margin-top: 6px; padding: 3px 10px; background: rgba(255,255,255,.95); color: #065f46; border-radius: 8px;
         font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 800; font-size: 1.02rem; letter-spacing: .06em; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .confirmation { animation: none; } button { transition: none; } }
  [hidden] { display: none !important; }

  /* ---------- Responsive ---------- */
  @media (max-height: 700px) and (min-width: 901px) {
    .topbar-inner { padding: 10px 24px; }
    main { gap: 14px; padding-bottom: 14px; }
    .col { gap: 14px; }
    .card { padding: 14px 16px; }
  }
  @media (max-width: 900px) {
    html, body { height: auto; }
    main { grid-template-columns: minmax(0, 1fr); padding: 4px 16px 24px; }
    .steps { display: none; }
    .topbar-inner { padding: 12px 16px; }
  }
  @media (max-width: 520px) {
    .products { grid-template-columns: minmax(0, 1fr); }
    .cart-row { grid-template-columns: minmax(0, 1fr) auto; row-gap: 8px; }
    .cart-row .line-total { text-align: left; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M3 4h2.2l2.1 10.2a1.5 1.5 0 0 0 1.5 1.2h8.4a1.5 1.5 0 0 0 1.5-1.1L20.5 8H6.1"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg>
      </span>
      <span class="brand-name">QuickCart</span>
      <span class="brand-tag">Simple, secure checkout</span>
    </div>
    <ol class="steps" aria-label="Checkout progress">
      <li id="step-1" class="active"><span class="n">1</span>Cart</li>
      <li id="step-2"><span class="n">2</span>Details</li>
      <li id="step-3"><span class="n">3</span>Confirmed</li>
    </ol>
  </div>
</header>

<main>
  <div class="col">
    <section class="card" aria-labelledby="catalog-h">
      <h2 id="catalog-h">Products</h2>
      <div id="catalog" class="products"></div>
    </section>

    <section class="card grow" aria-labelledby="cart-h">
      <h2 id="cart-h">Your cart</h2>
      <p id="empty-cart-message" class="empty muted" data-testid="empty-cart-message">
        <strong>Your cart is empty</strong>
        <span>Add a product above to get started.</span>
      </p>
      <div id="cart-items" data-testid="cart-items"></div>
      <div class="total-row">
        <span class="label">Order total</span>
        <span id="order-total" data-testid="order-total">$0.00</span>
      </div>
    </section>
  </div>

  <div class="col">
    <section id="confirmation" class="confirmation" data-testid="confirmation" role="status" tabindex="-1" hidden>
      <div class="tick" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <div>
        <h2>Order confirmed</h2>
        <p>Thank you, <strong id="confirm-name" data-testid="confirm-name"></strong>! Your order is placed.</p>
        <span id="order-reference" class="ref" data-testid="order-reference"></span>
        <p>Total paid: <strong id="confirm-total" data-testid="confirm-total"></strong></p>
      </div>
    </section>

    <section class="card" aria-labelledby="checkout-h">
      <h2 id="checkout-h">Checkout</h2>
      <form id="checkout-form" novalidate>
        <label for="customer-name">Full name (required)</label>
        <input type="text" id="customer-name" name="name" data-testid="customer-name"
               autocomplete="name" placeholder="e.g. Asha Verma" aria-describedby="name-error">
        <p id="name-error" class="error" role="alert" data-testid="name-error" hidden></p>
        <p id="cart-error" class="error" role="alert" data-testid="cart-error" hidden></p>
        <button type="submit" id="place-order" class="btn-primary" data-testid="place-order" style="margin-top:14px">Place Order</button>
        <p class="secure">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          Demo checkout. No payment is taken.
        </p>
      </form>
    </section>
  </div>
</main>

<script>
(function () {
  'use strict';

  // Prices are stored in cents to avoid floating point errors.
  const ICONS = {
    mouse:    '<svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="6"/><path d="M12 2.5v6.5"/></svg>',
    keyboard: '<svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2.5"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7.5 14h9"/></svg>'
  };
  const PRODUCTS = [
    { id: 'mouse',    name: 'Wireless Mouse',      price: 2500 },
    { id: 'keyboard', name: 'Mechanical Keyboard', price: 6000 }
  ];
  const MAX_QTY = 99;

  const cart = {};     // productId -> quantity
  let orderPlaced = false;

  const $ = (id) => document.getElementById(id);
  const money = (cents) => '$' + (cents / 100).toFixed(2);

  function setStep(n) {
    [1, 2, 3].forEach((i) => {
      const el = $('step-' + i);
      el.className = i < n ? 'done' : (i === n ? 'active' : '');
    });
  }

  function renderCatalog() {
    $('catalog').innerHTML = PRODUCTS.map((p) => `
      <div class="product">
        <span class="badge" data-badge="${p.id}" hidden aria-hidden="true"></span>
        <div class="icon" aria-hidden="true">${ICONS[p.id]}</div>
        <div><div class="pname">${p.name}</div><div class="price">${money(p.price)}</div></div>
        <button type="button" class="btn-add" data-testid="add-${p.id}" data-add="${p.id}"
                aria-label="Add ${p.name} to cart" ${orderPlaced ? 'disabled' : ''}>Add to cart</button>
      </div>`).join('');
  }

  function renderCart() {
    const ids = PRODUCTS.map((p) => p.id).filter((id) => cart[id] > 0);
    $('empty-cart-message').hidden = ids.length > 0;

    $('cart-items').innerHTML = ids.map((id) => {
      const p = PRODUCTS.find((x) => x.id === id);
      const q = cart[id];
      const dis = orderPlaced ? 'disabled' : '';
      return `
      <div class="cart-row" data-testid="cart-row-${id}">
        <div><div class="pname">${p.name}</div><div class="price">${money(p.price)} each</div></div>
        <div class="qty">
          <button type="button" data-dec="${id}" data-testid="dec-${id}" aria-label="Decrease quantity of ${p.name}" ${q <= 1 ? 'disabled' : dis}>−</button>
          <input type="number" min="1" max="${MAX_QTY}" step="1" value="${q}" data-qty="${id}"
                 data-testid="qty-${id}" aria-label="Quantity of ${p.name}" ${dis}>
          <button type="button" data-inc="${id}" data-testid="inc-${id}" aria-label="Increase quantity of ${p.name}" ${q >= MAX_QTY ? 'disabled' : dis}>+</button>
        </div>
        <span class="line-total" data-testid="line-total-${id}">${money(p.price * q)}</span>
        <button type="button" class="btn-link" data-remove="${id}" data-testid="remove-${id}" aria-label="Remove ${p.name}" ${dis}>Remove</button>
      </div>`;
    }).join('');

    // "x2" badges on the product cards (text only, no re-render, so keyboard focus is kept)
    PRODUCTS.forEach((p) => {
      const b = document.querySelector('[data-badge="' + p.id + '"]');
      if (!b) return;
      b.hidden = !(cart[p.id] > 0);
      b.textContent = '×' + (cart[p.id] || 0);
    });

    const total = ids.reduce((sum, id) => sum + PRODUCTS.find((x) => x.id === id).price * cart[id], 0);
    $('order-total').textContent = money(total);
    if (!orderPlaced) setStep(total > 0 ? 2 : 1);
    return total;
  }

  function lockForm() {
    $('place-order').disabled = true;
    $('place-order').textContent = 'Order placed';
    $('customer-name').disabled = true;
  }

  function setQty(id, raw) {
    let q = parseInt(raw, 10);
    if (Number.isNaN(q) || q < 1) q = 1;
    if (q > MAX_QTY) q = MAX_QTY;
    cart[id] = q;
    renderCart();
  }

  function hideErrors() {
    ['name-error', 'cart-error'].forEach((id) => { $(id).hidden = true; $(id).textContent = ''; });
    $('customer-name').removeAttribute('aria-invalid');
  }

  function newReference() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = '';
    for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return 'ORD-' + s;
  }

  // --- Events -----------------------------------------------------------
  document.addEventListener('click', (e) => {
    if (orderPlaced) return;
    const t = e.target.closest('button');
    if (!t) return;
    if (t.dataset.add)    { cart[t.dataset.add] = Math.min((cart[t.dataset.add] || 0) + 1, MAX_QTY); renderCart(); }
    if (t.dataset.inc)    { setQty(t.dataset.inc, (cart[t.dataset.inc] || 0) + 1); }
    if (t.dataset.dec)    { setQty(t.dataset.dec, (cart[t.dataset.dec] || 1) - 1); }
    if (t.dataset.remove) { delete cart[t.dataset.remove]; renderCart(); }
  });

  document.addEventListener('change', (e) => {
    if (orderPlaced) return;
    if (e.target.dataset && e.target.dataset.qty) setQty(e.target.dataset.qty, e.target.value);
  });

  $('customer-name').addEventListener('input', () => {
    $('name-error').hidden = true;
    $('name-error').textContent = '';
    $('customer-name').removeAttribute('aria-invalid');
  });

  $('checkout-form').addEventListener('submit', (e) => {
    e.preventDefault();
    if (orderPlaced) return;                       // guard against double submit

    hideErrors();
    const name = $('customer-name').value.trim();
    const total = renderCart();                    // re-sync totals from state
    let valid = true;

    if (total === 0) {
      $('cart-error').textContent = 'Your cart is empty. Add at least one item to check out.';
      $('cart-error').hidden = false;
      valid = false;
    }
    if (name === '') {
      $('name-error').textContent = 'Please enter your full name to place the order.';
      $('name-error').hidden = false;
      $('customer-name').setAttribute('aria-invalid', 'true');
      valid = false;
    }
    if (!valid) {
      if (name === '') $('customer-name').focus();
      return;                                      // cart and typed values are left untouched
    }

    orderPlaced = true;                            // set synchronously, before any rendering
    lockForm();
    renderCatalog();
    renderCart();
    setStep(4);                                    // all steps done
    $('step-3').className = 'done';
    $('confirm-name').textContent = name;
    $('order-reference').textContent = newReference();
    $('confirm-total').textContent = money(total);
    $('confirmation').hidden = false;
    $('confirmation').focus({ preventScroll: true });
    $('confirmation').scrollIntoView({ block: 'nearest' });
  });

  renderCatalog();
  renderCart();
})();
</script>
</body>
</html>
